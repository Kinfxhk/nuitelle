services:
  nuitelle:
    build: .
    image: nuitelle:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./media}:/media:ro
    environment:
      NUITTELLE_ROOTS: /media
      NUITTELLE_DB: /data/nuitelle.db
      NUITTELLE_COVERS: /data/covers
      NUITTELLE_ADDR: 0.0.0.0:8770

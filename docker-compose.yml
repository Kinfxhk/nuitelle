services:
  vela:
    build: .
    image: vela:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - ./data:/data
      - ${MEDIA_DIR:-./media}:/media:ro
    environment:
      VELA_ROOTS: /media
      VELA_DB: /data/vela.db
      VELA_COVERS: /data/covers
      VELA_ADDR: 0.0.0.0:8770

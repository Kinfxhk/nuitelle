<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuitelle</title>
<style>
:root{--bg:#0c0a08;--bg2:#110f0c;--panel:#171410;--panel2:#1e1a15;--line:#2a241d;--line2:#38312a;--text:#ede7dd;--mute:#a4978a;--mute2:#736a5e;--accent:#e8a952;--accent-ink:#241708;--danger:#d97b6a;--ok:#86a866;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang TC","Hiragino Sans GB","Noto Sans TC","Noto Sans SC","Noto Sans KR","Noto Sans JP","Microsoft YaHei",sans-serif}
[hidden]{display:none!important} /* class display rules must never override the hidden attribute */
a{color:inherit;text-decoration:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;border-right:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.4px;padding:0 10px 16px}
.logo span{color:var(--accent)}
.rail-nav{display:flex;flex-direction:column;gap:3px}
.rail-nav button{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:none;border:1px solid transparent;color:var(--mute);padding:9px 12px;border-radius:10px;font-size:14px;transition:background .12s,color .12s}
.rail-nav button:hover{color:var(--text);background:var(--panel2)}
.rail-nav button.on{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--panel2);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.rail-nav button.on .ic{color:var(--accent)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.hpill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute2);padding:7px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.hpill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
select.lang{appearance:none;-webkit-appearance:none;background:var(--panel2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a4978a' stroke-width='1.6' stroke-linecap='round'/></svg>") no-repeat right 10px center;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 30px 8px 12px;font-size:14px}
/* stage + topbar */
.stage{min-width:0}
.topbar{display:flex;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(17,15,12,.9);backdrop-filter:blur(10px);z-index:20;flex-wrap:wrap}
.searchwrap{position:relative;display:flex;align-items:center;flex:1;min-width:200px;max-width:560px}
.searchwrap .ic{position:absolute;left:11px;color:var(--mute2);pointer-events:none}
.search{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:9px 12px 9px 34px;width:100%;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 13px;font-size:14px;transition:border-color .12s,background .12s,color .12s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--text);background:var(--panel2);border-color:transparent}
.btn .ic{width:16px;height:16px}
main{padding:22px 24px 64px}
.greet{font-size:20px;font-weight:650;margin:0 0 20px}
.stats{color:var(--mute2);font-size:12.5px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--mute);transition:border-color .12s,color .12s;white-space:nowrap}
.chip b{font-weight:600;color:var(--mute2);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.on b{color:var(--accent-ink);opacity:.75}
/* shelves + cards */
.shelf-title{font-size:13px;font-weight:600;color:var(--text);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.shelf-title::before{content:'';width:10px;height:3px;border-radius:2px;background:var(--accent)}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;margin-bottom:24px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 93%,transparent);mask-image:linear-gradient(90deg,#000 93%,transparent)}
.shelf .card{flex:0 0 208px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 16px}
.card{position:relative;cursor:pointer}
.favstar{position:absolute;top:6px;right:8px;z-index:5;background:#0008;border:0;color:#dfe5ee;font-size:16px;border-radius:8px;padding:2px 6px;cursor:pointer}
.favstar.on{color:var(--accent)}
.hovervid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:#000}
.loadmore{display:flex;justify-content:center;margin:22px 0}
.art{aspect-ratio:16/9;background:#0b0d11 center/cover no-repeat;position:relative;border-radius:var(--radius);overflow:hidden;transition:box-shadow .14s}
.card:hover .art,.card:focus-visible .art{box-shadow:0 0 0 2px var(--accent),0 10px 30px #0009}
.card:has(.pick:checked) .art{box-shadow:0 0 0 2px var(--accent)}
.card:hover .art::before{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;background:rgba(0,0,0,.38);text-shadow:0 2px 12px #000}
.art .dur{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.78);padding:2px 7px;border-radius:6px;font-size:11.5px;color:#f2ece2;font-variant-numeric:tabular-nums;backdrop-filter:blur(2px)}
.art .res{position:absolute;left:7px;bottom:7px;background:rgba(0,0,0,.78);padding:2px 7px;border-radius:6px;font-size:11px;color:#cdbfae;backdrop-filter:blur(2px)}
.progtrk{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.5)}
.art .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 80%,transparent)}
.meta{padding:9px 3px 0}
.title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:11.5px;color:var(--mute2);margin-top:2px}
.tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--mute);background:var(--panel2);border-radius:999px;padding:2px 8px}
.pick{position:absolute;top:9px;left:9px;z-index:3;width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
@media(hover:hover){.pick{opacity:0;transition:opacity .12s}.card:hover .pick,.pick:checked,.pick:focus-visible{opacity:1}} /* shortcut: coarse pointers keep checkboxes visible; revisit if long-press select is wanted */
.empty{color:var(--mute);padding:60px 10px;text-align:center;line-height:1.9}
/* dialogs + player */
dialog{border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:16px;padding:0;width:min(1120px,94vw);box-shadow:0 30px 90px #000d}
dialog::backdrop{background:rgba(4,3,2,.74);backdrop-filter:blur(3px)}
.player{display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.phead .grow{flex:1;min-width:0}
.phead h3{margin:0;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player video{width:100%;max-height:74vh;background:#000;display:block}
.pfoot{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;flex-wrap:wrap}
.pleft{flex:1;min-width:220px}
.pright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.tagin{background:var(--panel2);border:1px dashed var(--line2);color:var(--text);border-radius:999px;padding:4px 12px;font-size:12px;width:150px;margin-top:6px}
.tagin:focus{border-color:var(--accent);outline:none}
.pmore{display:flex;gap:8px;align-items:center;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--mute);border-radius:9px;padding:7px 11px;font-size:13px;min-height:34px;min-width:36px;transition:border-color .12s,color .12s}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent)}
.iconbtn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.iconbtn.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
/* panels + palette + bulkbar + toast */
.panel{position:fixed;right:16px;top:64px;width:340px;max-height:calc(100vh - 84px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:16px;display:none;z-index:30;box-shadow:0 24px 70px #000c}
.panel.open{display:block}
.panel-close{position:sticky;top:0;float:right;z-index:2;background:var(--panel2);min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.topbar .btn,.topbar .search,.topbar .lang{flex:0 0 auto}
@media(min-width:821px) and (max-width:1240px){.topbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.topbar::-webkit-scrollbar{display:none}}
.pfoot{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pfoot::-webkit-scrollbar{display:none}
.pfoot>*{flex:0 0 auto}
button,.iconbtn,.btn,.chip{touch-action:manipulation}
@media(max-width:640px){.panel{left:10px;right:10px;top:60px;width:auto}}
.panel .adv-sec{display:none}
.panel.adv .adv-sec{display:block}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--panel2);padding:4px;border-radius:10px}
.tabs button{flex:1;background:none;border:0;color:var(--mute);border-radius:8px;padding:7px 8px;font-size:13px}
.tabs button.on{color:var(--text);background:var(--panel);border:1px solid var(--line2)}
.panel h4{margin:0 0 10px;font-size:12px;color:var(--mute2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .name{flex:1;font-size:13.5px}
.small{color:var(--mute);font-size:12px}
.bulkbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:35;box-shadow:0 16px 50px #000d;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.bulkbar .count{font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.bulkbar input{padding:9px 12px;width:140px}
@media(min-width:821px){.bulkbar{left:calc(50% + 116px)}} /* centre on the content column (rail is 232px) */
.palette{position:fixed;inset:0;background:rgba(4,3,2,.6);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50;backdrop-filter:blur(2px)}
.palette.open{display:flex}
.palette .box{width:min(620px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #000c}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--text);padding:16px 18px;font-size:16px;outline:none}
.palette .list{max-height:46vh;overflow:auto}
.palette .item{padding:11px 18px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.palette .item .kind{margin-left:auto;color:var(--mute2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.palette .item.sel,.palette .item:hover{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;font-size:13.5px;box-shadow:0 10px 30px #000a;white-space:nowrap}
.toast.show{opacity:1}
/* mobile */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(12,10,8,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
.mobile-nav button{background:none;border:0;color:var(--mute);font-size:10.5px;padding:5px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:52px}.mobile-nav .ic{width:20px;height:20px;stroke-width:2}
.mobile-nav button.on{color:var(--accent)}
@media(max-width:820px){
  .shell{display:block}.rail{display:none}.mobile-nav{display:flex}
  main{padding:16px 12px calc(92px + env(safe-area-inset-bottom))!important}
  .topbar{padding:10px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}.topbar::-webkit-scrollbar{display:none}
  .searchwrap{min-width:190px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .greet{font-size:17px}
  .bulkbar{left:12px;right:12px;transform:none;bottom:calc(66px + env(safe-area-inset-bottom))}
  dialog{width:96vw}
  .shelf .card{flex:0 0 180px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
}
/* people */
.people-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.people-tools .searchwrap{max-width:300px;flex:1;min-width:180px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:1px solid transparent;color:var(--mute);font-size:13px;padding:6px 12px;border-radius:7px}
.seg button.on{background:var(--panel);border-color:var(--line2);color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px 16px}
.pcard{cursor:pointer}
.pcard .part{aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;background:var(--panel2);position:relative;transition:box-shadow .14s}
.pcard .part img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.pcard .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--mute2)}
.pcard:hover .part,.pcard:focus-visible .part{box-shadow:0 0 0 2px var(--accent),0 10px 30px #0009}
.pcard.dropping .part{box-shadow:0 0 0 2px var(--accent);outline:2px dashed var(--accent);outline-offset:-7px}
.pcount{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.72);color:#f2ece2;border-radius:999px;padding:2px 8px;font-size:11.5px;font-variant-numeric:tabular-nums;backdrop-filter:blur(2px)}
.pover{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 8px;font-size:11.5px;color:#f2ece2;background:linear-gradient(transparent,rgba(0,0,0,.82));opacity:0;transition:opacity .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard:hover .pover,.pcard:focus-visible .pover{opacity:1}
.pset{position:absolute;left:8px;bottom:8px;z-index:3;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.16);color:#f2ece2;border-radius:8px;font-size:11px;padding:3px 8px;opacity:0;transition:opacity .12s}
.pcard:hover .pset,.pset:focus-visible{opacity:1}
.pcard.dropping .pset,.pcard.dropping .pover{opacity:0}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;text-align:left;width:100%;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--panel2)}
.avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--panel2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute2)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.prow .pinfo{min-width:0;flex:1}
.prow .pname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .psub{font-size:12px;color:var(--mute2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pchev{color:var(--mute2);margin-left:auto}
/* density + tv */
body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body[data-density="compact"] .meta{padding:6px 2px 0}
body[data-density="roomy"] .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
body.tv .title{font-size:18px}
body.tv .card:focus{outline:3px solid var(--accent);outline-offset:4px}
body.tv .shelf .card{flex:0 0 320px}
@media(max-width:820px){
  .pfoot{flex-wrap:wrap;overflow:visible}
  .pleft{min-width:0;flex:1 1 100%}
  dialog{max-height:100dvh;overflow:auto}
  .phead{position:sticky;top:0;background:var(--panel);z-index:2}
  .panel{top:calc(8px + env(safe-area-inset-top));bottom:calc(74px + env(safe-area-inset-bottom));max-height:none;padding-bottom:24px}
  .topbar{padding-top:calc(10px + env(safe-area-inset-top))}
}
@media(max-width:480px){
  .grid,.pgrid,body[data-density="roomy"] .grid,body.tv .grid,body[data-density="compact"] .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .search,.tagin,.panel input,.panel select,dialog input,dialog select{font-size:16px}
  .pick{width:44px;height:44px;top:2px;left:2px}
  .favstar{min-width:44px;min-height:44px;top:2px;right:2px}
  .iconbtn,.topbar .btn{min-height:44px}
  .shelf .card{flex:0 0 168px;width:168px;min-width:0}
  .toast{white-space:normal;max-width:calc(100vw - 24px);bottom:calc(84px + env(safe-area-inset-bottom))}
}
html.noscroll,html.noscroll body{overflow:hidden;height:100%}
@media(min-width:821px){
  .rail{height:100dvh;overflow:hidden}
  .rail-nav{min-height:0;overflow:auto}
  .rail-bottom{position:sticky;bottom:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
}
@media(max-width:1180px){
  .panel{left:auto;right:0;top:0;width:min(420px,100vw);height:100dvh;max-height:none;border-radius:0;z-index:45;padding-bottom:calc(24px + 74px + env(safe-area-inset-bottom))}
}
@media(min-width:821px) and (max-width:1180px){
  .panel{width:min(420px,46vw)}
}
.shelf{scroll-snap-type:x mandatory;-webkit-mask-image:none;mask-image:none}
.shelf .card{scroll-snap-align:start}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
@media(max-width:820px){
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))!important;gap:12px!important}
  .chips{mask-image:linear-gradient(90deg,#000 92%,transparent)}
}
@media(hover:none),(pointer:coarse){
  .pset{opacity:1;min-width:44px;min-height:44px}
  .pover{opacity:1}
}
#topMore{display:none}
@media(max-width:1240px){
  .topbar .secondary{display:none}
  #topMore{display:inline-flex}
}
.pmove{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;z-index:4}
.pmove button{min-width:32px;min-height:32px;padding:0;background:#0008;border:1px solid var(--line);color:#fff;border-radius:8px}
.bigplay{position:absolute;inset:0;margin:auto;width:64px;height:64px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:28px;z-index:5;cursor:pointer}
.bigplay.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">

<script>
const $ = s => document.querySelector(s);
const ICONS={home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',library:'<rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/>',favorites:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',tags:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-8 8z"/><circle cx="8" cy="8" r="1.5"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'};
function ico(name){ const el=document.createElementNS('http://www.w3.org/2000/svg','svg'); el.setAttribute('viewBox','0 0 24 24'); el.setAttribute('class','ic'); el.innerHTML=ICONS[name]||ICONS.link; return el; }
const nuitelleProfile = localStorage.getItem('nuitelle.profile')||localStorage.getItem('vela.profile')||'default';
const nuitelleToken = (() => { const m=location.hash.match(/token=([a-f0-9]+)/i); if(m){ localStorage.setItem('nuitelle.token',m[1]); history.replaceState(null,'',location.pathname+location.search); return m[1]; } return localStorage.getItem('nuitelle.token')||localStorage.getItem('vela.token')||''; })();
if(nuitelleToken){ document.cookie='nuitelle_token='+encodeURIComponent(nuitelleToken)+'; path=/; SameSite=Lax'; }
const api = (p, o) => { o=o||{}; o.headers=Object.assign({}, o.headers, {'X-Nuitelle-Profile':nuitelleProfile}, nuitelleToken?{'X-Nuitelle-Token':nuitelleToken}:{}); return fetch(p, o).then(r => { if (r.status===401) { showLogin(); throw new Error('auth required'); } if (!r.ok) throw new Error(r.status); return r.json(); }); };
function showLogin(){ $('#login').classList.add('open'); setTimeout(()=>$('#loginPw').focus(),40); }
async function doLogin(){ const pw=$('#loginPw').value, code=$('#loginCode').value; const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,code})}); if(r.ok){ location.reload(); } else { $('#loginErr').textContent='Wrong password or code'; } }
fetch('/api/auth-info').then(r=>r.json()).then(d=>{ if(d.totp) $('#loginCode').style.display='block'; }).catch(()=>{});
$('#loginBtn').onclick=doLogin;
$('#loginPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || (I18N_EXTRA[state.lang] && I18N_EXTRA[state.lang][k]) || I18N_EXTRA.en[k] || I18N.en[k] || k; }
function applyI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  renderNav(); renderStats(); renderChips();
  if(state.view==='people') renderPeople();
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function fmtDur(ms){ if(!ms) return ''; const s=Math.round(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }
function fmtSize(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB']; let i=0,n=b; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(n<10?1:0)+u[i]; }
function fmtWhen(ts){ if(!ts) return ''; const d=new Date(typeof ts==='number'&&ts<1e12?ts*1000:ts), now=new Date(); if(isNaN(d)) return ''; const days=Math.floor((now.setHours(0,0,0,0)-d.setHours(0,0,0,0))/864e5); if(days<=0) return t('today'); if(days===1) return t('yesterday'); if(days<8) return t('daysAgo').replace('{n}',days); return d.toLocaleDateString(state.lang.startsWith('zh')?'zh-TW':state.lang,{year:'numeric',month:'short',day:'numeric'}); }

let lastStats = {files:0,bytes:0,tags:0};
function renderStats(){
  const s = lastStats;
  $('#stats').textContent = `${s.files} ${t('files')} · ${fmtSize(s.bytes)} · ${s.tags} ${t('tagsLabel')}` + (state.tag?` · ${state.tag}`:'');
}
function navLabel(item){
  if(item.id==='trash') return t('trashPage');
  return t(item.id) !== item.id ? t(item.id) : item.label;
}

async function loadLayout(){
  state.layout = await api('/api/layout');
  const sb=state.layout.sidebar||[];
  if(!sb.some(i=>i.id==='favorites')) sb.push({id:'favorites',label:'Favourites',order:25});
  state.layout.sidebar=sb;
  applyTheme(); renderNav(); renderLayoutRows();
}
function syncLock(){
  const any=document.querySelector('#player[open]')||document.querySelector('.panel.open');
  document.documentElement.classList.toggle('noscroll',!!any);

function navAction(item){
  if(item.type==='link'){ window.open(item.url,'_blank','noopener'); return; }
  state.selected.clear(); updateBulk(); window.scrollTo({top:0});
  if(item.id!=='tags'){ state.navId=item.id; renderNav(); }
  if(item.id==='home'){ state.tag=''; state.q=''; $('#q').value=''; loadHome(); }
  else if(item.id==='tags'){ $('#chips').scrollIntoView({behavior:'smooth'}); }
  else if(item.id==='people'){ loadPeople(); }
  else if(item.id==='favorites'){ loadFavorites(); }
  else if(item.id==='trash'){ loadTrash(); }
  else if(item.id==='explore'){ loadExplore(); }
  else if(item.id==='tasks'){ loadTasks(); }
  else if(item.id==='device'){ loadDevice(); }
  else if(item.id==='sources'){ loadSources(); }
  else if(item.id==='catalog'){ loadCatalog('search'); }
  else load();
}

function cardEl(m){
  const c=document.createElement('div'); c.className='card'; c.tabIndex=0;
  const fav=document.createElement('button'); fav.className='favstar'+(m.favorite?' on':''); fav.textContent=m.favorite?'★':'☆';
  fav.onclick=async e=>{ e.stopPropagation(); const r=await api('/api/media/'+m.id+'/favorite',{method:'POST'}); fav.textContent=r.favorite?'★':'☆'; fav.classList.toggle('on',r.favorite); };
  c.appendChild(fav);
  const pick=document.createElement('input'); pick.type='checkbox'; pick.className='pick'; pick.dataset.mid=m.id; pick.checked=state.selected.has(m.id);
  pick.onclick=e=>e.stopPropagation();
  pick.onchange=()=>{ if(pick.checked) state.selected.add(m.id); else state.selected.delete(m.id); updateBulk(); };
  c.appendChild(pick);
  const art=document.createElement('div'); art.className='art';
  art.style.backgroundImage=`url(/api/media/${m.id}/cover)`;
  let hoverTimer=null, hoverVid=null;
  const canHover=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(canHover) c.addEventListener('mouseenter',()=>{ hoverTimer=setTimeout(()=>{ const hv=document.createElement('video'); hv.className='hovervid'; hv.muted=true; hv.playsInline=true; hv.src='/api/media/'+m.id+'/stream'; hv.autoplay=true; hv.loop=true; hv.onloadedmetadata=()=>{ try{hv.currentTime=Math.min(2,hv.duration*0.1)}catch(e){} }; art.appendChild(hv); hv.play().catch(()=>{}); hoverVid=hv; },350); });
  if(canHover) c.addEventListener('mouseleave',()=>{ if(hoverTimer) clearTimeout(hoverTimer); if(hoverVid){ hoverVid.remove(); hoverVid=null; } });
  c.addEventListener('click',()=>{ if(hoverTimer) clearTimeout(hoverTimer); if(hoverVid){ hoverVid.remove(); hoverVid=null; } });
  if(m.duration_ms){ const dd=document.createElement('div'); dd.className='dur'; dd.textContent=fmtDur(m.duration_ms); art.appendChild(dd); }
  if(m.position_ms && m.duration_ms){ const tk=document.createElement('i'); tk.className='progtrk'; art.appendChild(tk); const b=document.createElement('i'); b.className='prog'; b.style.width=Math.min(100,m.position_ms/m.duration_ms*100)+'%'; art.appendChild(b); }
  if(m.width){ const r=document.createElement('div'); r.className='res'; r.textContent=m.height?`${m.height}p`:''; art.appendChild(r); }
  const meta=document.createElement('div'); meta.className='meta';
  const tt=document.createElement('div'); tt.className='title'; tt.textContent=m.title;
  const wh=document.createElement('div'); wh.className='when'; wh.textContent=fmtWhen(m.added_at);
  const tg=document.createElement('div'); tg.className='tags';
  (m.tags||[]).slice(0,3).forEach(x=>{ const sp=document.createElement('span'); sp.className='tag'; sp.textContent=x; tg.appendChild(sp); });
  meta.append(tt,wh,tg); c.append(art,meta);
  if(state.view==='playlist' && state.playlistId){
    c.draggable=true;
    c.ondragstart=()=>{ state.dragId=m.id; };
    c.ondragover=e=>e.preventDefault();
    c.ondrop=async e=>{
      e.preventDefault();
      const from=state.items.findIndex(x=>x.id===state.dragId), to=state.items.findIndex(x=>x.id===m.id);
      if(from<0||to<0||from===to) return;
      const [it]=state.items.splice(from,1); state.items.splice(to,0,it);
      const g=$('#grid'); g.innerHTML=''; state.items.forEach(x=>g.appendChild(cardEl(x)));
      await api('/api/playlists/'+state.playlistId+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:state.items.map(x=>x.id)})});
      toast(t('layoutSaved'));
    };
    const mv=document.createElement('div'); mv.className='pmove';
    const upBtn=document.createElement('button'); upBtn.textContent='↑';
    const dnBtn=document.createElement('button'); dnBtn.textContent='↓';
    const move=async(dir)=>{ const i=state.items.findIndex(x=>x.id===m.id), j=i+dir; if(i<0||j<0||j>=state.items.length) return; [state.items[i],state.items[j]]=[state.items[j],state.items[i]]; const g=$('#grid'); g.innerHTML=''; state.items.forEach(x=>g.appendChild(cardEl(x))); await api('/api/playlists/'+state.playlistId+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:state.items.map(x=>x.id)})}); };
    upBtn.onclick=e=>{ e.stopPropagation(); move(-1); };
    dnBtn.onclick=e=>{ e.stopPropagation(); move(1); };
    mv.append(upBtn,dnBtn); c.appendChild(mv);
    const rm=document.createElement('button'); rm.className='iconbtn'; rm.textContent='×';
    rm.style.cssText='position:absolute;top:6px;right:6px;z-index:4;padding:0 6px';
    rm.onclick=async e=>{ e.stopPropagation(); await api('/api/playlists/'+state.playlistId+'/items/'+m.id,{method:'DELETE'}); state.items=state.items.filter(x=>x.id!==m.id); const g=$('#grid'); g.innerHTML=''; state.items.forEach(x=>g.appendChild(cardEl(x))); };
    c.appendChild(rm);
  }
  let lpTimer=null, lpStart=null, lpFired=false;
  c.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; lpStart={x:e.clientX,y:e.clientY}; lpFired=false; lpTimer=setTimeout(()=>{ lpFired=true; state.selected.add(m.id); updateBulk(); if(navigator.vibrate) navigator.vibrate(12); },450); });
  c.addEventListener('pointermove',e=>{ if(!lpStart||!lpTimer) return; if(Math.abs(e.clientX-lpStart.x)>8||Math.abs(e.clientY-lpStart.y)>8){ clearTimeout(lpTimer); lpTimer=null; } });
  c.addEventListener('pointerup',()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } });
  c.addEventListener('pointercancel',()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } });
  c.onclick=()=>{ if(lpFired){ lpFired=false; return; } if(state.selected.size>0){ const on=state.selected.has(m.id); if(on) state.selected.delete(m.id); else state.selected.add(m.id); const pk=c.querySelector('.pick'); if(pk) pk.checked=!on; updateBulk(); return; } openPlayer(m.id); };
  return c;
}

function personCard(p){

  if(state.hls){ state.hls.destroy(); state.hls=null; }
  const v=$('#video'); v.poster=`/api/media/${m.id}/cover`; v.preload='auto';
  const mode=localStorage.getItem('nuitelle.playMode')||'auto';

  if(mode==='hls'){ startHLS(m.id, pickHeight()); }
  else { v.src=`/api/media/${m.id}/stream`; } v.playbackRate=Number($('#speedSel').value||1);
  v.onended=()=>{ if(state.index < state.queueIds.length-1) openPlayer(state.queueIds[state.index+1]); };
  v.onerror=()=>{ if(state.current && !state.hls) startHLS(state.current.id, pickHeight()); };
  if(mode==='auto'){
    measureSpeed(m.id).then(sp=>{ if(state.current && state.current.id===m.id && sp<3 && (m.height||0)>720 && !state.hls){ startHLS(m.id, pickHeight()); } });
  }
  v.onloadedmetadata=()=>{ if(d.position_ms && d.position_ms < v.duration*1000-3000) v.currentTime=d.position_ms/1000; };
  $('#player').showModal(); syncLock(); history.pushState({overlay:1},'');
  const bp=$('#bigPlay'); bp.classList.remove('hidden');
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata=new MediaMetadata({title:m.title,artist:'Nuitelle',artwork:[{src:'/api/media/'+m.id+'/cover',sizes:'480x270',type:'image/jpeg'}]});
      navigator.mediaSession.setActionHandler('play',()=>v.play());
      navigator.mediaSession.setActionHandler('pause',()=>v.pause());
      navigator.mediaSession.setActionHandler('seekbackward',()=>{v.currentTime=Math.max(0,v.currentTime-10)});
      navigator.mediaSession.setActionHandler('seekforward',()=>{v.currentTime=Math.min(v.duration||0,v.currentTime+10)});
      navigator.mediaSession.setActionHandler('previoustrack',()=>$('#prevBtn').click());
      navigator.mediaSession.setActionHandler('nexttrack',()=>$('#nextBtn').click());
    }catch(e){}
  }
  let ts=null;
  v.addEventListener('touchstart',e=>{ if(e.touches.length!==1) return; ts={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
  v.addEventListener('touchend',e=>{ if(!ts) return; const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y; if(Math.abs(dx)>60&&Math.abs(dy)<50){ v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+(dx>0?10:-10))); } else if(dy>90&&Math.abs(dx)<60){ closePlayer(); } ts=null; },{passive:true});
  v.onplaying=()=>bp.classList.add('hidden');
  v.onpause=()=>{ if(v.readyState<2) bp.classList.remove('hidden'); };
  v.onwaiting=()=>bp.classList.remove('hidden');
  bp.onclick=()=>{ v.play().catch(()=>{}); };
  v.play().catch(()=>{});
  clearTimeout(state.stallTimer);
  state.stallTimer=setTimeout(()=>{ if(state.current && v.readyState<1 && !state.hls){ startHLS(state.current.id, pickHeight()); } },6000);
  loadSubs(m.id).catch(()=>{}); loadSugg(m.id).catch(()=>{}); loadMarkers(m.id).catch(()=>{}); loadMediaPeople(m.id).catch(()=>{});
  clearInterval(state.saveTimer);
  state.saveTimer=setInterval(()=>{ if(!v.paused) saveProgress(); },5000);
}
const paletteCommands=[
  {label:'Home',kind:'go',run:()=>navAction({id:'home'})},
  {label:'Library',kind:'go',run:()=>navAction({id:'library'})},
  {label:'People',kind:'go',run:()=>navAction({id:'people'})},

  {label:'Scan',kind:'action',run:()=>$('#scanBtn').click()},

];
let paletteSel=0, paletteItems=[];
function renderPalette(q){
  const box=$('#paletteList'); box.innerHTML=''; paletteItems=[];
  const cmds=paletteCommands.filter(c=>c.label.toLowerCase().includes(q.toLowerCase()));
  cmds.forEach(c=>paletteItems.push(c));
  if(q.length>=2){
    api('/api/media?q='+encodeURIComponent(q)+'&limit=8').then(d=>{
      (d.items||[]).forEach(m=>paletteItems.push({label:m.title,kind:'media',run:()=>openPlayer(m.id)}));
      paintPalette();
    }).catch(()=>{});
  }
  paintPalette();
}
function paintPalette(){
  const box=$('#paletteList'); box.innerHTML='';
  paletteItems.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='item'+(i===paletteSel?' sel':'');
    const l=document.createElement('span'); l.textContent=it.label;
    const k=document.createElement('span'); k.className='kind'; k.textContent=it.kind;
    row.append(l,k); row.onclick=()=>{ closePalette(); it.run(); };
    box.appendChild(row);
  });
  if(!paletteItems.length){ const row=document.createElement('div'); row.className='item'; row.textContent='—'; box.appendChild(row); }
}
function openPalette(){ $('#palette').classList.add('open'); $('#paletteInput').value=''; paletteSel=0; renderPalette(''); setTimeout(()=>$('#paletteInput').focus(),30); }
function closePalette(){ $('#palette').classList.remove('open'); }
$('#paletteInput').addEventListener('input',e=>{ paletteSel=0; renderPalette(e.target.value.trim()); });
$('#palette').addEventListener('click',e=>{ if(e.target.id==='palette') closePalette(); });
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#palette').classList.contains('open')?closePalette():openPalette(); return; }
  if(!$('#palette').classList.contains('open')) return;
  if(e.key==='Escape'){ closePalette(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel=Math.min(paletteSel+1,paletteItems.length-1); paintPalette(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel=Math.max(0,paletteSel-1); paintPalette(); }
  else if(e.key==='Enter'){ const it=paletteItems[paletteSel]; if(it){ closePalette(); it.run(); } }
});

function hapticURL(){ const proto=location.protocol==='https:'?'wss':'ws'; return proto+'://'+location.host+'/api/haptic'+(nuitelleToken?'?token='+nuitelleToken:''); }
const haptic={ws:null,ctx:null,an:null,src:null,timer:null,on:false};
async function toggleHaptics(){
  const v=$('#video');
  if(haptic.on){ stopHaptics(); return; }
  try{
    haptic.ws=new WebSocket(hapticURL());
    await new Promise((res,rej)=>{ haptic.ws.onopen=res; haptic.ws.onerror=rej; setTimeout(rej,1500); });
    haptic.ws.send(JSON.stringify({op:'hello'}));
    if(!haptic.ctx){ haptic.ctx=new AudioContext(); haptic.src=haptic.ctx.createMediaElementSource(v); haptic.an=haptic.ctx.createAnalyser(); haptic.an.fftSize=1024; haptic.src.connect(haptic.an); haptic.an.connect(haptic.ctx.destination); }
    haptic.on=true; $('#hapticBtn').textContent='◉';
    const pat=$('#patternSel')?$('#patternSel').value:'audio';
    if(pat!=='audio'){ sendPattern(); }
    else haptic.timer=setInterval(()=>{
      if(v.paused){ return; }
      const d=new Uint8Array(haptic.an.frequencyBinCount); haptic.an.getByteFrequencyData(d);
      const ny=haptic.ctx.sampleRate/2, n=d.length; let lo=0,lc=0,hi=0,hc=0;
      for(let i=1;i<n;i++){ const f=i*ny/n; if(f<120){ lo+=d[i]; lc++; } else if(f>2000&&f<8000){ hi+=d[i]; hc++; } }
      const low=lc?lo/lc/255:0, high=hc?hi/hc/255:0;
      haptic.ws.send(JSON.stringify({op:'tick',low,high,intensity:Number($('#hapticInt').value)/100}));
    },60);
    toast('feedback on');
  }catch(e){ toast('hapticsd offline'); try{haptic.ws.close()}catch(_){} haptic.ws=null; }
}
function sendPattern(){
  if(!haptic.ws || haptic.ws.readyState!==1) return;
  const name=$('#patternSel')?$('#patternSel').value:'audio';
  const intensity=Number($('#hapticInt')?$('#hapticInt').value:70)/100;
  if(name==='audio'){ return; }
  haptic.ws.send(JSON.stringify({op:'pattern',pattern:name,intensity}));
}
function stopHaptics(){
  if(haptic.timer) clearInterval(haptic.timer); haptic.timer=null;
  if(haptic.ws){ try{ haptic.ws.send(JSON.stringify({op:'stop'})); haptic.ws.close(); }catch(e){} haptic.ws=null; }
  haptic.on=false; $('#hapticBtn').textContent='◎';
}

function pickHeight(){

async function measureSpeed(id){

    const r=await fetch('/api/media/'+id+'/stream',{headers:Object.assign({'Range':'bytes=0-262143'}, nuitelleToken?{'X-Nuitelle-Token':nuitelleToken}:{})});
    const b=await r.arrayBuffer();
    const secs=(performance.now()-t)/1000;
    state.speed=(b.byteLength*8)/secs/1e6;
  }catch(e){ state.speed=10; }
  return state.speed;
}

}

$('#metaBtn').onclick=async()=>{ if(!state.current) return; const r=await api('/api/media/'+state.current.id+'/metadata-fetch',{method:'POST'}); state.current=r.item; $('#pTitle').textContent=r.item.title; const tags=$('#pTags'); tags.innerHTML=''; (r.item.tags||[]).forEach(x=>{const sp=document.createElement('span');sp.className='tag';sp.textContent=x;tags.appendChild(sp);}); toast(Object.keys(r.applied||{}).join(',')||'no plugin'); };
$('#aiBtn').onclick=async()=>{ if(!state.current) return; const id=state.current.id; await api('/api/media/'+id+'/ai-tag',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); toast('AI…'); pollSuggestions(id); };
$('#addPlBtn').onclick=()=>{ if(state.current) addToPlaylist([state.current.id]); };
$('#castBtn').onclick=async()=>{ const v=$('#video'); if(v.remote && v.remote.prompt){ try{ await v.remote.prompt(); }catch(e){} } else { toast('Cast not supported in this browser'); } };
$('#dlBtn').onclick=()=>{ if(!state.current) return; const a=document.createElement('a'); a.href='/api/media/'+state.current.id+'/stream?download=1'+(nuitelleToken?'&token='+nuitelleToken:''); a.download=''; document.body.appendChild(a); a.click(); a.remove(); };
$('#hapticBtn').onclick=toggleHaptics;
$('#abBtn').onclick=()=>{ const v=$('#video'); if(state.abA===null){ state.abA=v.currentTime; toast('A'); } else if(state.abB===null){ state.abB=v.currentTime; toast('B'); } else { state.abA=null; state.abB=null; toast('A-B off'); } };
$('#collectionsBtn').onclick=async()=>{ await loadCollections(); $('#collectionsPanel').classList.toggle('open'); };
$('#bulkTagBtn').onclick=async()=>{ const v=$('#bulkTag').value.trim(); if(!v) return; await bulk('tag',v); $('#bulkTag').value=''; };
$('#bulkTrashBtn').onclick=()=>bulk('trash','');
$('#bulkClearBtn').onclick=()=>{ state.selected.clear(); updateBulk(); load(); };
$('#bulkSelAll').onclick=()=>{ const all=state.selected.size===state.items.length && state.items.length>0; state.selected.clear(); if(!all) state.items.forEach(m=>state.selected.add(m.id)); document.querySelectorAll('#grid .pick').forEach(p=>{ p.checked=state.selected.has(p.dataset.mid); }); updateBulk(); };
$('#accentInput').oninput=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{accent:e.target.value}); applyTheme(); };
$('#densitySel').onchange=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{density:e.target.value}); applyTheme(); };
['showCast','showHaptics','showMarkers'].forEach(id=>{ const el=document.getElementById(id); if(el) el.onchange=()=>{ const key=id.replace('show','').toLowerCase(); state.layout.theme=Object.assign({},state.layout.theme,{[key]:el.checked}); applyTheme(); }; });
$('#tvToggle').onchange=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{tv:e.target.checked}); applyTheme(); };
$('#radiusInput').oninput=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{radius:Number(e.target.value)}); applyTheme(); };
$('#addLinkBtn').onclick=()=>{ const label=$('#linkLabel').value.trim(), url=$('#linkURL').value.trim(); if(!label||!url) return; state.layout.sidebar=state.layout.sidebar||[]; state.layout.sidebar.push({id:'link-'+Date.now(),label,url,type:'link',order:100+state.layout.sidebar.length}); $('#linkLabel').value=''; $('#linkURL').value=''; renderNav(); renderLayoutRows(); };
$('#lang').onchange=e=>{ state.lang=e.target.value; localStorage.setItem('nuitelle.lang', state.lang); applyI18n(); if(state.view==='home') loadHome(); else load(); };

function tvMove(dir){
  const cards=[...document.querySelectorAll('#grid .card, #home .card')];
  if(!cards.length) return;
  const cur=document.activeElement && document.activeElement.classList.contains('card')?document.activeElement:null;
  if(!cur){ cards[0].focus(); return; }
  const r=cur.getBoundingClientRect();
  let best=null, bestScore=1e9;
  cards.forEach(c=>{
    if(c===cur) return;
    const b=c.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(r.left+r.width/2), dy=(b.top+b.height/2)-(r.top+r.height/2);
    const ok = dir==='left'?dx<-8:dir==='right'?dx>8:dir==='up'?dy<-8:dy>8;
    if(!ok) return;
    const score=(dir==='left'||dir==='right')?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*3;
    if(score<bestScore){ bestScore=score; best=c; }
  });
  if(best) best.focus();
}
let padPrev={};
setInterval(()=>{
  if(!document.body.classList.contains('tv')) return;
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){ if(!p) continue;
    const ax=p.axes[0]||0, ay=p.axes[1]||0;
    const dir = ax<-0.5?'left':ax>0.5?'right':ay<-0.5?'up':ay>0.5?'down':'';
    if(dir && padPrev[p.index]!==dir){ tvMove(dir); padPrev[p.index]=dir; }
    if(!dir) padPrev[p.index]='';
    if(p.buttons[0] && p.buttons[0].pressed && document.activeElement.classList.contains('card')){ document.activeElement.click(); }
  }
},200);
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('tv') && !state.current && !document.querySelector('#palette.open')){
    if(e.key==='ArrowLeft'){ e.preventDefault(); tvMove('left'); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); tvMove('right'); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); tvMove('up'); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); tvMove('down'); return; }
    if(e.key==='Enter' && document.activeElement.classList.contains('card')){ e.preventDefault(); document.activeElement.click(); return; }
  }
  if(!state.current || document.activeElement.tagName==='INPUT') return;
  const v=$('#video');
  if(e.key==='ArrowRight'){ v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
  else if(e.key==='ArrowLeft'){ v.currentTime=Math.max(0,v.currentTime-5); }
  else if(e.key===' '){ e.preventDefault(); v.paused?v.play():v.pause(); }
  else if(e.key==='f'){ document.fullscreenElement?document.exitFullscreen():v.requestFullscreen().catch(()=>{}); }
  else if(e.key==='n'){ $('#nextBtn').click(); }
});
async function refreshHealth(){
  const el=$('#healthPill'); if(!el) return;
  try{
    const h=await api('/api/health');
    el.querySelector('.dot').style.background = h.scanning?'var(--accent)':'var(--ok)';
    $('#healthTxt').textContent = h.scanning?t('healthScanning'):t('healthOnline');
  }catch(e){
    el.querySelector('.dot').style.background = 'var(--danger)';
    $('#healthTxt').textContent = t('healthOffline');
  }
}
setInterval(refreshHealth,15000); refreshHealth();

const savedLang = localStorage.getItem('nuitelle.lang')||localStorage.getItem('vela.lang');
const navLang = (navigator.language||'en');
state.lang = savedLang || (['zh-Hant','zh-Hans','ko','ja'].includes(navLang) ? navLang
  : (navLang.startsWith('zh') ? (navLang.includes('TW')||navLang.includes('HK') ? 'zh-Hant' : 'zh-Hans') : 'en'));
$('#lang').value = state.lang;
applyI18n();
loadProfiles().catch(()=>{}); loadLayout().then(loadCollections).then(loadPlaylists).then(loadHome).catch(()=>{ document.querySelector('main').innerHTML='<div class="empty">Cannot reach the API. Is the server running?</div>'; });
</script>

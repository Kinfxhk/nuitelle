<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela</title>
<style>
:root{--bg:#0e1014;--panel:#151922;--panel2:#1b2130;--line:#242c3a;--text:#e8ecf3;--mute:#8b96a8;--accent:#e0a458;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--line)}
.rail-nav{display:flex;flex-direction:column;gap:4px}
.rail-nav button{text-align:left;width:100%;background:none;border:1px solid transparent;color:var(--mute);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.rail-nav button.on,.rail-nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.stage{min-width:0}
.topbar{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,20,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
.mobile-nav button{background:none;border:0;color:var(--mute);font-size:11px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;min-width:56px}
.mobile-nav button.on{color:var(--accent)}
@media(max-width:820px){.shell{display:block}.rail{display:none}.mobile-nav{display:flex}main{padding-bottom:88px}.topbar{padding:10px 12px}}
.logo{font-weight:700;letter-spacing:.5px;font-size:18px}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px;margin-left:8px}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:14px}
nav button.on,nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
.spacer{flex:1}
input,button,select{font:inherit}
.search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;width:min(320px,36vw)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1a1208;border-color:var(--accent);font-weight:600}
select.lang{padding:8px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
main{padding:18px 20px 60px}
.stats{color:var(--mute);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mute);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.shelf-title{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;margin:0 0 8px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;scrollbar-width:thin}
.shelf .card{flex:0 0 220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:#3a465c}
.art{aspect-ratio:16/9;background:#0b0d11 center/cover no-repeat;position:relative}
.art .dur{position:absolute;right:7px;bottom:7px;background:#000a;padding:2px 6px;border-radius:6px;font-size:11px;color:#dfe5ee}
.art .res{position:absolute;left:7px;bottom:7px;background:#000a;padding:2px 6px;border-radius:6px;font-size:11px;color:#9fb0c8}
.meta{padding:10px 11px 12px}
.title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;min-height:18px}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.empty{color:var(--mute);padding:60px 10px;text-align:center;line-height:1.9}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:0;width:min(1100px,94vw)}
dialog::backdrop{background:#000b}
.player{display:flex;flex-direction:column}
.player video{width:100%;max-height:72vh;background:#000}
.pbody{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.pbody .grow{flex:1;min-width:180px}
.pbody h3{margin:0;font-size:15px;font-weight:600}
.small{color:var(--mute);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.panel{position:fixed;right:16px;top:70px;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:none;z-index:30;box-shadow:0 12px 40px #000a}
.panel.open{display:block}
.panel h4{margin:0 0 10px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .name{flex:1}
.pick{position:absolute;top:8px;left:8px;z-index:3;width:18px;height:18px;accent-color:var(--accent);opacity:.85}
.bulkbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:35;box-shadow:0 10px 30px #000a;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.bulkbar input{width:150px}
body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body[data-density="compact"] .meta{padding:7px 8px 9px}
body[data-density="roomy"] .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
@media(max-width:640px){header{gap:8px}.search{width:100%;order:5}main{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo">vela<span>.</span></div>
    <nav id="nav" class="rail-nav"></nav>
    <div class="rail-bottom">
      <span id="healthPill" class="small" style="white-space:nowrap">●</span>
      <select id="lang" class="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
      <button class="btn" id="settingsBtn" data-i18n="layout"></button>
    </div>
  </aside>
  <div class="stage">
    <header class="topbar">
      <input id="q" class="search" data-i18n-ph="search" autocomplete="off">
      <button class="btn" id="scanBtn" data-i18n="scan"></button>
      <button class="btn" id="saveViewBtn" data-i18n="saveView"></button>
      <button class="btn" id="collectionsBtn" data-i18n="collections"></button>
      <button class="btn" id="playlistsBtn" data-i18n="playlists"></button>
      <button class="btn" id="reviewBtn" data-i18n="review"></button>
      <button class="btn" id="toolsBtn" data-i18n="tools"></button>
    </header>
    <main>
      <div id="home"></div>
      <div class="stats" id="stats"></div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <div data-i18n="emptyTitle"></div>
        <div data-i18n="emptyHint"></div>
      </div>
    </main>
  </div>
</div>

<nav class="mobile-nav" id="mobileNav" aria-label="Primary"></nav>

<dialog id="player">
  <div class="player">
    <video id="video" controls playsinline></video>
    <div class="pbody">
      <div class="grow">
        <h3 id="pTitle"></h3>
        <div class="small" id="pMeta"></div>
        <div class="tags" id="pTags"></div>
        <div class="tags" id="sugg"></div>
      </div>
      <select id="subSel" class="lang" style="display:none"></select>
      <select id="subOff" class="lang" title="Subtitle offset" style="display:none">
        <option value="-2">−2s</option><option value="-1">−1s</option><option value="-0.5">−0.5s</option>
        <option value="0" selected>0s</option><option value="0.5">+0.5s</option><option value="1">+1s</option><option value="2">+2s</option>
      </select>
      <button class="iconbtn" id="subsBtn" data-i18n="subs"></button>
      <button class="iconbtn" id="prevBtn" title="Previous">‹</button>
      <button class="iconbtn" id="nextBtn" title="Next">›</button>
      <select id="speedSel" class="lang"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button class="iconbtn" id="favBtn" title="Favourite">☆</button>
      <button class="iconbtn" id="aiBtn" title="AI tags">AI</button>
      <button class="iconbtn" id="abBtn" title="A-B loop">A-B</button>
      <button class="iconbtn" id="addPlBtn" title="Add to playlist">＋</button>
      <input id="tagInput" class="search" style="width:150px" data-i18n-ph="addTag">
      <button class="iconbtn" id="trashBtn" data-i18n="trash"></button>
      <button class="iconbtn" id="closeBtn" data-i18n="close"></button>
    </div>
  </div>
</dialog>

<div class="panel" id="panel">
  <h4 data-i18n="panelTitle"></h4>
  <div id="layoutRows"></div>
  <h4 style="margin-top:14px" data-i18n="theme"></h4>
  <div class="row"><div class="name" data-i18n="accent"></div><input id="accentInput" type="color" value="#e0a458"></div>
  <div class="row"><div class="name" data-i18n="density"></div>
    <select id="densitySel" class="lang"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="roomy">Roomy</option></select></div>
  <div class="row"><div class="name" data-i18n="radius"></div><input id="radiusInput" type="range" min="0" max="24" value="12"></div>
  <h4 style="margin-top:14px" data-i18n="addLink"></h4>
  <div class="row"><input id="linkLabel" class="search" style="width:110px" data-i18n-ph="label"><input id="linkURL" class="search" style="width:130px" data-i18n-ph="url"><button class="iconbtn" id="addLinkBtn" data-i18n="add"></button></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" id="presetSimple" data-i18n="presetSimple" style="flex:1"></button>
    <button class="btn" id="presetFull" data-i18n="presetFull" style="flex:1"></button>
  </div>
  <button class="btn" id="tagManagerBtn" data-i18n="manageTags" style="width:100%;margin-top:10px"></button>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn primary" id="saveLayout" data-i18n="save"></button>
    <button class="btn" id="resetLayout" data-i18n="reset"></button>
  </div>
</div>

<div class="panel" id="playlistsPanel" style="top:170px">
  <h4 data-i18n="playlists"></h4>
  <div id="playlistRows"></div>
  <button class="btn" id="newPlaylistBtn" data-i18n="newPlaylist" style="width:100%;margin-top:8px"></button>
</div>

<div class="panel" id="collectionsPanel" style="top:120px">
  <h4 data-i18n="collections"></h4>
  <div id="collectionRows"></div>
</div>

<dialog id="toolsDlg">
  <div style="padding:14px;min-width:min(620px,92vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="tools"></h3>
      <button class="iconbtn" id="toolsClose" data-i18n="close"></button>
    </div>
    <h4 style="margin:10px 0 6px;font-size:12px;color:var(--mute)" data-i18n="health"></h4>
    <div id="healthRows" class="small"></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="duplicates"></h4>
    <div id="dupRows" style="max-height:32vh;overflow:auto"></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="aiFolder"></h4>
    <div class="row"><input id="aiFolderPath" class="search" style="width:70%" placeholder="/media/folder"><button class="iconbtn" id="aiFolderBtn" data-i18n="apply"></button></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="remap"></h4>
    <div class="row"><input id="remapOld" class="search" style="width:46%" placeholder="/old/root"><input id="remapNew" class="search" style="width:46%" placeholder="/new/root"><button class="iconbtn" id="remapBtn" data-i18n="apply"></button></div>
  </div>
</dialog>

<dialog id="reviewDlg">
  <div style="padding:14px;min-width:min(560px,92vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="review"></h3>
      <button class="iconbtn" id="reviewClose" data-i18n="close"></button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn" id="acceptHigh" data-i18n="acceptAll"></button>
    </div>
    <div id="reviewRows" style="max-height:60vh;overflow:auto"></div>
  </div>
</dialog>

<dialog id="tagDlg">
  <div style="padding:14px;min-width:min(420px,90vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="manageTags"></h3>
      <button class="iconbtn" id="tagClose" data-i18n="close"></button>
    </div>
    <div id="tagRows" style="max-height:60vh;overflow:auto"></div>
  </div>
</dialog>

<div class="bulkbar" id="bulkbar" hidden>
  <span id="bulkCount"></span>
  <input id="bulkTag" class="search" data-i18n-ph="addTag">
  <button class="iconbtn" id="bulkTagBtn" data-i18n="applyTag"></button>
  <button class="iconbtn" id="bulkAiBtn">AI</button>
  <button class="iconbtn" id="bulkTrashBtn" data-i18n="trashSel"></button>
  <button class="iconbtn" id="bulkClearBtn" data-i18n="clear"></button>
</div>

<div class="toast" id="toast"></div>

function fmtDur(ms){ if(!ms) return ''; const s=Math.round(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }
function fmtSize(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB']; let i=0,n=b; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(n<10?1:0)+u[i]; }

function navLabel(item){ return t(item.id) !== item.id ? t(item.id) : item.label; }

async function loadLayout(){

function navAction(item){
  if(item.type==='link'){ window.open(item.url,'_blank','noopener'); return; }
  if(item.id==='home'){ state.tag=''; state.q=''; $('#q').value=''; loadHome(); }
  else if(item.id==='tags'){ $('#chips').scrollIntoView({behavior:'smooth'}); }
  else if(item.id==='favorites'){ state.tag='favorite'; load(); }
  else load();
}
function renderNav(){
  const nav=$('#nav'); if(!nav) return; nav.innerHTML='';
  (state.layout?.sidebar||[]).filter(i=>!i.hidden).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(item=>{
    const b=document.createElement('button'); b.textContent=navLabel(item);
    b.onclick=()=>navAction(item);
    if(item.id==='home') b.classList.add('on');
    nav.appendChild(b);
  });
  renderMobileNav();
}
function renderMobileNav(){
  const box=$('#mobileNav'); if(!box) return; box.innerHTML='';
  const items=(state.layout?.sidebar||[]).filter(i=>!i.hidden && i.type!=='link').slice(0,4);
  items.forEach(item=>{ const b=document.createElement('button'); b.textContent=navLabel(item); b.onclick=()=>navAction(item); box.appendChild(b); });

function renderLayoutRows(){
  const box=$('#layoutRows'); if(!box) return; box.innerHTML='';

    const up=document.createElement('button'); up.className='iconbtn'; up.textContent='↑'; up.disabled=i===0;

function updateBulk(){

async function bulk(action,value){

function cardEl(m){
  const c=document.createElement('div'); c.className='card';
  const pick=document.createElement('input'); pick.type='checkbox'; pick.className='pick'; pick.checked=state.selected.has(m.id);
  pick.onclick=e=>e.stopPropagation();
  pick.onchange=()=>{ if(pick.checked) state.selected.add(m.id); else state.selected.delete(m.id); updateBulk(); };
  c.appendChild(pick);
  const art=document.createElement('div'); art.className='art';
  art.style.backgroundImage=`url(/api/media/${m.id}/cover)`;
  if(m.duration_ms){ const dd=document.createElement('div'); dd.className='dur'; dd.textContent=fmtDur(m.duration_ms); art.appendChild(dd); }
  if(m.width){ const r=document.createElement('div'); r.className='res'; r.textContent=m.height?`${m.height}p`:''; art.appendChild(r); }
  const meta=document.createElement('div'); meta.className='meta';
  const tt=document.createElement('div'); tt.className='title'; tt.textContent=m.title;
  const tg=document.createElement('div'); tg.className='tags';
  (m.tags||[]).slice(0,3).forEach(x=>{ const sp=document.createElement('span'); sp.className='tag'; sp.textContent=x; tg.appendChild(sp); });
  meta.append(tt,tg); c.append(art,meta);
  c.onclick=()=>openPlayer(m.id);
  return c;
}
function shelf(title, items){
  if(!items || !items.length) return null;

  const h=document.createElement('h3'); h.className='shelf-title'; h.textContent=title; sec.appendChild(h);
  const row=document.createElement('div'); row.className='shelf';

async function load(){

  const d=await api('/api/media?'+p);
  state.items=d.items||[];
  const s=await api('/api/stats'); lastStats=s; renderStats();
  state.view='library';
  $('#home').hidden=true; $('#grid').hidden=false; $('#chips').hidden=false;
  const grid=$('#grid'); grid.innerHTML='';
  $('#empty').hidden = state.items.length>0;
  state.items.forEach(m=>{ grid.appendChild(cardEl(m)); });
  const tags=await api('/api/tags'); state.tags=tags.tags||[]; renderChips();

async function openPlayer(id){
  const d=await api('/api/media/'+id);
  state.current=d.item; const m=d.item;
  $('#pTitle').textContent=m.title;
  $('#pMeta').textContent=[fmtDur(m.duration_ms),m.width?`${m.width}×${m.height}`:'',m.vcodec,m.acodec,fmtSize(m.size)].filter(Boolean).join(' · ');
  const tags=$('#pTags'); tags.innerHTML='';
  (m.tags||[]).forEach(x=>{ const sp=document.createElement('span'); sp.className='tag'; sp.textContent=x; tags.appendChild(sp); });
  state.queueIds = state.items.map(x=>x.id); state.index = Math.max(0, state.queueIds.indexOf(m.id));
  const fav=(m.tags||[]).includes('favorite'); $('#favBtn').textContent = fav?'★':'☆';
  const v=$('#video'); v.poster=`/api/media/${m.id}/cover`; v.src=`/api/media/${m.id}/stream`; v.playbackRate=Number($('#speedSel').value||1);
  v.onended=()=>{ if(state.index < state.queueIds.length-1) openPlayer(state.queueIds[state.index+1]); };
  v.onloadedmetadata=()=>{ if(d.position_ms && d.position_ms < v.duration*1000-3000) v.currentTime=d.position_ms/1000; };
  $('#player').showModal(); v.play().catch(()=>{});
  loadSubs(m.id).catch(()=>{}); loadSugg(m.id).catch(()=>{});
  clearInterval(state.saveTimer);
  state.saveTimer=setInterval(()=>{ if(!v.paused) saveProgress(); },5000);
}

function pollSuggestions(id){

async function loadSubs(id){

  state.subs=d.items||[];

}

function applyTrack(url){
  const v=$('#video');
  v.querySelectorAll('track').forEach(x=>x.remove());
  if(!url) return;
  const tr=document.createElement('track');
  tr.kind='subtitles'; tr.src=url; tr.default=true;
  v.appendChild(tr);
  tr.addEventListener('load',()=>{ if(v.textTracks[0]) v.textTracks[0].mode='showing'; });
}
function pollSubs(id){
  let n=0;
  const timer=setInterval(async()=>{
    n++; const d=await api('/api/media/'+id+'/subtitles').catch(()=>null);
    if(d && d.job && d.job.running===false){
      clearInterval(timer);
      if(d.job.error){ toast(d.job.error); } else { await loadSubs(id); toast(t('tagAdded')); }
    }
    if(n>100) clearInterval(timer);
  },3000);
}

$('#trashBtn').onclick=async()=>{ if(!state.current) return; if(!confirm(t('confirmTrash'))) return; await api('/api/media/'+state.current.id+'/trash',{method:'POST'}); toast(t('moved')); closePlayer(); };
$('#subsBtn').onclick=async()=>{ if(!state.current) return; const id=state.current.id; const target=(state.lang==='en'?'':state.lang); await api('/api/media/'+id+'/subtitles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({translate:target})}); toast(t('generating')); pollSubs(id); };
$('#tagInput').addEventListener('keydown',async e=>{ if(e.key!=='Enter'||!state.current) return; const name=e.target.value.trim(); if(!name) return; const r=await api('/api/media/'+state.current.id+'/tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({add:[name]})}); e.target.value=''; const tags=$('#pTags'); tags.innerHTML=''; (r.item.tags||[]).forEach(x=>{const sp=document.createElement('span');sp.className='tag';sp.textContent=x;tags.appendChild(sp);}); toast(t('tagAdded')); });

let qt; $('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ state.q=e.target.value.trim(); load(); },220); });
$('#scanBtn').onclick=async()=>{ const r=await api('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); toast(r.started?t('scanning'):t('already')); setTimeout(load,4000); };
$('#settingsBtn').onclick=()=>$('#panel').classList.toggle('open');
$('#saveLayout').onclick=async()=>{ await api('/api/layout',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.layout)}); toast(t('layoutSaved')); $('#panel').classList.remove('open'); };
$('#resetLayout').onclick=async()=>{ state.layout = await api('/api/layout'); renderLayoutRows(); renderNav(); toast(t('loaded')); };
async function openTagManager(){
  const d=await api('/api/tags');
  const box=$('#tagRows'); box.innerHTML='';
  (d.tags||[]).forEach(x=>{
    const row=document.createElement('div'); row.className='row';
    const n=document.createElement('div'); n.className='name'; n.textContent=`${x.name} (${x.count})`;
    const rn=document.createElement('button'); rn.className='iconbtn'; rn.textContent=t('rename');
    rn.onclick=async()=>{ const v=prompt(t('rename')+': '+x.name); if(!v) return; await api('/api/tags/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:x.name,to:v})}); openTagManager(); load(); };
    const mg=document.createElement('button'); mg.className='iconbtn'; mg.textContent=t('merge');
    mg.onclick=async()=>{ const v=prompt(t('merge')+' →'); if(!v) return; await api('/api/tags/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:x.name,to:v})}); openTagManager(); load(); };
    const del=document.createElement('button'); del.className='iconbtn'; del.textContent='×';
    del.onclick=async()=>{ if(!confirm('Delete '+x.name+'?')) return; await api('/api/tags/'+encodeURIComponent(x.name),{method:'DELETE'}); openTagManager(); load(); };
    row.append(n,rn,mg,del); box.appendChild(row);
  });
  $('#tagDlg').showModal();
}
$('#tagManagerBtn').onclick=openTagManager;
$('#tagClose').onclick=()=>$('#tagDlg').close();

function setPreset(kind){
  const base=[{id:'home',label:'Home',order:10},{id:'library',label:'Library',order:20},{id:'favorites',label:'Favourites',order:30}];
  if(kind==='full') base.push({id:'tags',label:'Tags',order:40});
  state.layout.sidebar=base;
  renderNav(); renderLayoutRows();
}
$('#presetSimple').onclick=()=>setPreset('simple');
$('#presetFull').onclick=()=>setPreset('full');

$('#saveViewBtn').onclick=async()=>{ const name=prompt(t('saveView')); if(!name) return; await api('/api/collections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,query:JSON.stringify({q:state.q,tag:state.tag})})}); await loadCollections(); toast(t('layoutSaved')); };
$('#playlistsBtn').onclick=async()=>{ await loadPlaylists(); $('#playlistsPanel').classList.toggle('open'); };
$('#newPlaylistBtn').onclick=async()=>{ const name=prompt(t('newPlaylist')); if(!name) return; await api('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); loadPlaylists(); };
$('#toolsBtn').onclick=openTools;
$('#toolsClose').onclick=()=>$('#toolsDlg').close();
$('#aiFolderBtn').onclick=async()=>{ const folder=$('#aiFolderPath').value.trim(); if(!folder) return; const r=await api('/api/ai/tag-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder})}); toast('AI '+r.total); setTimeout(openReview,1500); };
$('#remapBtn').onclick=async()=>{ const old=$('#remapOld').value.trim(), nw=$('#remapNew').value.trim(); if(!old||!nw) return; const r=await api('/api/remap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old,new:nw})}); toast('updated '+r.updated); };
$('#reviewBtn').onclick=openReview;
$('#reviewClose').onclick=()=>$('#reviewDlg').close();
$('#acceptHigh').onclick=async()=>{ const d=await api('/api/suggestions'); (d.items||[]).filter(x=>x.confidence>=0.9).forEach(async x=>{ await api('/api/media/'+x.media_id+'/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accept:[x.name]})}); }); setTimeout(openReview,800); };
$('#bulkAiBtn').onclick=async()=>{ const ids=[...state.selected]; if(!ids.length) return; await api('/api/ai/tag-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}); toast('AI…'); setTimeout(openReview,1500); };
$('#aiBtn').onclick=async()=>{ if(!state.current) return; const id=state.current.id; await api('/api/media/'+id+'/ai-tag',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); toast('AI…'); pollSuggestions(id); };
$('#addPlBtn').onclick=()=>{ if(state.current) addToPlaylist([state.current.id]); };
$('#abBtn').onclick=()=>{ const v=$('#video'); if(state.abA===null){ state.abA=v.currentTime; toast('A'); } else if(state.abB===null){ state.abB=v.currentTime; toast('B'); } else { state.abA=null; state.abB=null; toast('A-B off'); } };
$('#collectionsBtn').onclick=async()=>{ await loadCollections(); $('#collectionsPanel').classList.toggle('open'); };
$('#bulkTagBtn').onclick=async()=>{ const v=$('#bulkTag').value.trim(); if(!v) return; await bulk('tag',v); $('#bulkTag').value=''; };
$('#bulkTrashBtn').onclick=()=>bulk('trash','');
$('#bulkClearBtn').onclick=()=>{ state.selected.clear(); updateBulk(); load(); };
$('#accentInput').oninput=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{accent:e.target.value}); applyTheme(); };
$('#densitySel').onchange=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{density:e.target.value}); applyTheme(); };
$('#radiusInput').oninput=e=>{ state.layout.theme=Object.assign({},state.layout.theme,{radius:Number(e.target.value)}); applyTheme(); };
$('#addLinkBtn').onclick=()=>{ const label=$('#linkLabel').value.trim(), url=$('#linkURL').value.trim(); if(!label||!url) return; state.layout.sidebar=state.layout.sidebar||[]; state.layout.sidebar.push({id:'link-'+Date.now(),label,url,type:'link',order:100+state.layout.sidebar.length}); $('#linkLabel').value=''; $('#linkURL').value=''; renderNav(); renderLayoutRows(); };
$('#lang').onchange=e=>{ state.lang=e.target.value; localStorage.setItem('vela.lang', state.lang); applyI18n(); };

document.addEventListener('keydown',e=>{
  if(!state.current || document.activeElement.tagName==='INPUT') return;
  const v=$('#video');
  if(e.key==='ArrowRight'){ v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
  else if(e.key==='ArrowLeft'){ v.currentTime=Math.max(0,v.currentTime-5); }
  else if(e.key===' '){ e.preventDefault(); v.paused?v.play():v.pause(); }
  else if(e.key==='f'){ document.fullscreenElement?document.exitFullscreen():v.requestFullscreen().catch(()=>{}); }
  else if(e.key==='n'){ $('#nextBtn').click(); }
});
async function refreshHealth(){
  try{ const h=await api('/api/health'); const el=$('#healthPill'); if(el){ el.textContent=h.scanning?'● scanning':'● online'; el.style.color=h.scanning?'var(--accent)':'#6fbf73'; } }
  catch(e){ const el=$('#healthPill'); if(el){ el.textContent='● offline'; el.style.color='#d06b6b'; } }
}
setInterval(refreshHealth,15000); refreshHealth();

const savedLang = localStorage.getItem('vela.lang');
const navLang = (navigator.language||'en');
state.lang = savedLang || (['zh-Hant','zh-Hans','ko','ja'].includes(navLang) ? navLang
  : (navLang.startsWith('zh') ? (navLang.includes('TW')||navLang.includes('HK') ? 'zh-Hant' : 'zh-Hans') : 'en'));
$('#lang').value = state.lang;
applyI18n();
loadLayout().then(loadCollections).then(loadPlaylists).then(loadHome).catch(()=>{ document.querySelector('main').innerHTML='<div class="empty">Cannot reach the API. Is the server running?</div>'; });
</script>
</body>
</html>

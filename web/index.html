<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela</title>
<style>
:root{--bg:#0e1014;--panel:#151922;--panel2:#1b2130;--line:#242c3a;--text:#e8ecf3;--mute:#8b96a8;--accent:#e0a458;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--line)}
.rail-nav{display:flex;flex-direction:column;gap:4px}
.rail-nav button{text-align:left;width:100%;background:none;border:1px solid transparent;color:var(--mute);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.rail-nav button.on,.rail-nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.stage{min-width:0}
.topbar{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,20,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
.mobile-nav button{background:none;border:0;color:var(--mute);font-size:11px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;min-width:56px}
.mobile-nav button.on{color:var(--accent)}
@media(max-width:820px){.shell{display:block}.rail{display:none}.mobile-nav{display:flex}main{padding-bottom:88px}.topbar{padding:10px 12px}}
.logo{font-weight:700;letter-spacing:.5px;font-size:18px}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px;margin-left:8px}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:14px}
nav button.on,nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}
.spacer{flex:1}
input,button,select{font:inherit}
.search{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;width:min(320px,36vw)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1a1208;border-color:var(--accent);font-weight:600}
select.lang{padding:8px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
main{padding:18px 20px 60px}
.stats{color:var(--mute);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mute);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.shelf-title{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;margin:0 0 8px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;scrollbar-width:thin}
.shelf .card{flex:0 0 220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:#3a465c}
.art{aspect-ratio:16/9;background:#0b0d11 center/cover no-repeat;position:relative}
.art .dur{position:absolute;right:7px;bottom:7px;background:#000a;padding:2px 6px;border-radius:6px;font-size:11px;color:#dfe5ee}
.art .res{position:absolute;left:7px;bottom:7px;background:#000a;padding:2px 6px;border-radius:6px;font-size:11px;color:#9fb0c8}
.meta{padding:10px 11px 12px}
.title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;min-height:18px}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.empty{color:var(--mute);padding:60px 10px;text-align:center;line-height:1.9}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:0;width:min(1100px,94vw)}
dialog::backdrop{background:#000b}
.player{display:flex;flex-direction:column}
.player video{width:100%;max-height:72vh;background:#000}
.pbody{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.pbody .grow{flex:1;min-width:180px}
.pbody h3{margin:0;font-size:15px;font-weight:600}
.small{color:var(--mute);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.panel{position:fixed;right:16px;top:70px;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:none;z-index:30;box-shadow:0 12px 40px #000a}
.panel.open{display:block}
.panel .adv-sec{display:none}
.panel.adv .adv-sec{display:block}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 8px;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.panel h4{margin:0 0 10px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .name{flex:1}
.pick{position:absolute;top:8px;left:8px;z-index:3;width:18px;height:18px;accent-color:var(--accent);opacity:.85}
.bulkbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:35;box-shadow:0 10px 30px #000a;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.bulkbar input{width:150px}
body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body[data-density="compact"] .meta{padding:7px 8px 9px}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
body.tv .title{font-size:18px}
body.tv .topbar{padding:18px 24px}
body.tv .card:focus{outline:3px solid var(--accent);outline-offset:4px}
body.tv .shelf .card{flex:0 0 300px}
body[data-density="roomy"] .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.palette{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
.palette.open{display:flex}
.palette .box{width:min(620px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #000b}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:16px 18px;font-size:16px;outline:none}
.palette .list{max-height:46vh;overflow:auto}
.palette .item{padding:11px 18px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.palette .item .kind{margin-left:auto;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.palette .item.sel,.palette .item:hover{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
@media(max-width:640px){header{gap:8px}.search{width:100%;order:5}main{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo">vela<span>.</span></div>
    <nav id="nav" class="rail-nav"></nav>
    <div class="rail-bottom">
      <select id="profileSel" class="lang" aria-label="Profile"></select>
      <span id="healthPill" class="small" style="white-space:nowrap">●</span>
      <select id="lang" class="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
      <button class="btn" id="settingsBtn" data-i18n="layout"></button>
    </div>
  </aside>
  <div class="stage">
    <header class="topbar">
      <input id="q" class="search" data-i18n-ph="search" autocomplete="off">
      <button class="btn" id="scanBtn" data-i18n="scan"></button>
      <button class="btn" id="saveViewBtn" data-i18n="saveView"></button>
      <button class="btn" id="collectionsBtn" data-i18n="collections"></button>
      <button class="btn" id="playlistsBtn" data-i18n="playlists"></button>
      <button class="btn" id="reviewBtn" data-i18n="review"></button>
      <button class="btn" id="ingestBtn" data-i18n="addURL"></button>
      <button class="btn" id="toolsBtn" data-i18n="tools"></button>
    </header>
    <main>
      <div id="home"></div>
      <div class="stats" id="stats"></div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <div data-i18n="emptyTitle"></div>
        <div data-i18n="emptyHint"></div>
      </div>
    </main>
  </div>
</div>

<nav class="mobile-nav" id="mobileNav" aria-label="Primary"></nav>

<dialog id="player">
  <div class="player">
    <video id="video" controls playsinline x-webkit-airplay="allow"></video>
    <div class="pbody">
      <div class="grow">
        <h3 id="pTitle"></h3>
        <div class="small" id="pMeta"></div>
        <div class="tags" id="pTags"></div>
        <div class="tags" id="sugg"></div>
        <div class="tags" id="markers"></div>
      </div>
      <select id="subSel" class="lang" style="display:none"></select>
      <select id="subOff" class="lang" title="Subtitle offset" style="display:none">
        <option value="-2">−2s</option><option value="-1">−1s</option><option value="-0.5">−0.5s</option>
        <option value="0" selected>0s</option><option value="0.5">+0.5s</option><option value="1">+1s</option><option value="2">+2s</option>
      </select>
      <button class="iconbtn" id="subsBtn" data-i18n="subs"></button>
      <button class="iconbtn" id="prevBtn" title="Previous">‹</button>
      <button class="iconbtn" id="nextBtn" title="Next">›</button>
      <select id="speedSel" class="lang"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button class="iconbtn" id="favBtn" title="Favourite">☆</button>
      <button class="iconbtn" id="aiBtn" title="AI tags">AI</button>
      <button class="iconbtn" id="metaBtn" title="Fetch metadata">Meta</button>
      <button class="iconbtn" id="subFetchBtn" title="Fetch subtitles">S+</button>
      <button class="iconbtn" id="markBtn" title="Add marker">M+</button>
      <button class="iconbtn" id="abBtn" title="A-B loop">A-B</button>
      <button class="iconbtn" id="castBtn" title="Cast">⧉</button>
      <button class="iconbtn" id="dlBtn" title="Download">⤓</button>
      <button class="iconbtn" id="hapticBtn" title="Controller feedback">◎</button>
      <input id="hapticInt" type="range" min="0" max="100" value="70" style="width:90px" title="Feedback intensity">
      <button class="iconbtn" id="addPlBtn" title="Add to playlist">＋</button>
      <input id="tagInput" class="search" style="width:150px" data-i18n-ph="addTag">
      <button class="iconbtn" id="trashBtn" data-i18n="trash"></button>
      <button class="iconbtn" id="closeBtn" data-i18n="close"></button>
    </div>
  </div>
</dialog>

<div class="panel" id="panel">
  <div class="tabs"><button id="tabBasic" class="on" data-i18n="basic"></button><button id="tabAdv" data-i18n="advanced"></button></div>
  <h4 data-i18n="panelTitle"></h4>
  <div id="layoutRows"></div>
  <h4 style="margin-top:14px" data-i18n="theme"></h4>
  <div class="row"><div class="name" data-i18n="accent"></div><input id="accentInput" type="color" value="#e0a458"></div>
  <div class="row"><div class="name" data-i18n="density"></div>
    <select id="densitySel" class="lang"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="roomy">Roomy</option></select></div>
  <div class="row"><div class="name" data-i18n="radius"></div><input id="radiusInput" type="range" min="0" max="24" value="12"></div>
  <div class="row"><div class="name" data-i18n="tvMode"></div><input id="tvToggle" type="checkbox"></div>
  <div class="adv-sec">
  <h4 style="margin-top:14px" data-i18n="addLink"></h4>
  <div class="row"><input id="linkLabel" class="search" style="width:110px" data-i18n-ph="label"><input id="linkURL" class="search" style="width:130px" data-i18n-ph="url"><button class="iconbtn" id="addLinkBtn" data-i18n="add"></button></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" id="presetSimple" data-i18n="presetSimple" style="flex:1"></button>
    <button class="btn" id="presetFull" data-i18n="presetFull" style="flex:1"></button>
  </div>
  <div class="adv-sec">
  <h4 style="margin-top:14px" data-i18n="experimental"></h4>
  <div class="row"><div class="name" data-i18n="showCast"></div><input id="showCast" type="checkbox"></div>
  <div class="row"><div class="name" data-i18n="showHaptics"></div><input id="showHaptics" type="checkbox"></div>
  <div class="row"><div class="name" data-i18n="showMarkers"></div><input id="showMarkers" type="checkbox"></div>
  <button class="btn" id="newProfileBtn" data-i18n="newProfile" style="width:100%;margin-top:10px"></button>
  <button class="btn" id="tagManagerBtn" data-i18n="manageTags" style="width:100%;margin-top:10px"></button>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn primary" id="saveLayout" data-i18n="save"></button>
    <button class="btn" id="resetLayout" data-i18n="reset"></button>
  </div>
</div>

<div class="panel" id="playlistsPanel" style="top:170px">
  <h4 data-i18n="playlists"></h4>
  <div id="playlistRows"></div>
  <button class="btn" id="newPlaylistBtn" data-i18n="newPlaylist" style="width:100%;margin-top:8px"></button>
</div>

<div class="panel" id="collectionsPanel" style="top:120px">
  <h4 data-i18n="collections"></h4>
  <div id="collectionRows"></div>
</div>

<div class="palette" id="login">
  <div class="box" style="max-width:360px">
    <div style="padding:20px">
      <h3 style="margin:0 0 12px;font-size:16px">Vela</h3>
      <input id="loginPw" type="password" placeholder="Password" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2);color:var(--text)">
      <input id="loginCode" inputmode="numeric" placeholder="6-digit code" style="display:none;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2);color:var(--text)">
      <div id="loginErr" class="small" style="color:#d06b6b;margin-top:8px"></div>
      <button class="btn primary" id="loginBtn" style="width:100%;margin-top:12px">Sign in</button>
    </div>
  </div>
</div>

<div class="palette" id="palette">
  <div class="box">
    <input id="paletteInput" placeholder="Jump to…" autocomplete="off">
    <div class="list" id="paletteList"></div>
  </div>
</div>

<dialog id="toolsDlg">
  <div style="padding:14px;min-width:min(620px,92vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="tools"></h3>
      <button class="iconbtn" id="toolsClose" data-i18n="close"></button>
    </div>
    <h4 style="margin:10px 0 6px;font-size:12px;color:var(--mute)" data-i18n="health"></h4>
    <div id="healthRows" class="small"></div>
    <div class="row"><div class="name" id="missingText"></div><button class="iconbtn" id="cleanMissing" data-i18n="clean" hidden></button></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="duplicates"></h4>
    <div id="dupRows" style="max-height:32vh;overflow:auto"></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)">Plugins</h4>
    <div id="pluginRows"></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="backup"></h4>
    <div class="row"><button class="btn" id="exportBtn" data-i18n="export"></button><input type="file" id="importFile" accept="application/json" style="display:none"><button class="btn" id="importBtn" data-i18n="import"></button></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="aiFolder"></h4>
    <div class="row"><input id="aiFolderPath" class="search" style="width:70%" placeholder="/media/folder"><button class="iconbtn" id="aiFolderBtn" data-i18n="apply"></button></div>
    <h4 style="margin:14px 0 6px;font-size:12px;color:var(--mute)" data-i18n="remap"></h4>
    <div class="row"><input id="remapOld" class="search" style="width:46%" placeholder="/old/root"><input id="remapNew" class="search" style="width:46%" placeholder="/new/root"><button class="iconbtn" id="remapBtn" data-i18n="apply"></button></div>
  </div>
</dialog>

<dialog id="pluginDlg" style="width:min(900px,94vw)">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)">
    <b id="pluginTitle"></b>
    <button class="iconbtn" id="pluginClose" data-i18n="close"></button>
  </div>
  <iframe id="pluginFrame" sandbox="allow-scripts" style="width:100%;height:70vh;border:0;background:#0e1014"></iframe>
</dialog>

<dialog id="reviewDlg">
  <div style="padding:14px;min-width:min(560px,92vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="review"></h3>
      <button class="iconbtn" id="reviewClose" data-i18n="close"></button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <button class="btn" id="acceptHigh" data-i18n="acceptAll"></button>
      <span id="jobState" class="small" style="flex:1"></span>
      <button class="iconbtn" id="cancelJob" data-i18n="cancel" hidden></button>
    </div>
    <div id="reviewRows" style="max-height:60vh;overflow:auto"></div>
  </div>
</dialog>

<dialog id="tagDlg">
  <div style="padding:14px;min-width:min(420px,90vw)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0;font-size:15px" data-i18n="manageTags"></h3>
      <button class="iconbtn" id="tagClose" data-i18n="close"></button>
    </div>
    <div id="tagRows" style="max-height:60vh;overflow:auto"></div>
  </div>
</dialog>

<div class="bulkbar" id="bulkbar" hidden>
  <span id="bulkCount"></span>
  <input id="bulkTag" class="search" data-i18n-ph="addTag">
  <button class="iconbtn" id="bulkTagBtn" data-i18n="applyTag"></button>
  <button class="iconbtn" id="bulkAiBtn">AI</button>
  <button class="iconbtn" id="bulkTranscode" data-i18n="transcode"></button>
  <button class="iconbtn" id="bulkTranslate" data-i18n="translate"></button>
  <button class="iconbtn" id="bulkTrashBtn" data-i18n="trashSel"></button>
  <button class="iconbtn" id="bulkClearBtn" data-i18n="clear"></button>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const velaProfile = localStorage.getItem('vela.profile')||'default';
const velaToken = (() => { const m=location.hash.match(/token=([a-f0-9]+)/i); if(m){ localStorage.setItem('vela.token',m[1]); history.replaceState(null,'',location.pathname+location.search); return m[1]; } return localStorage.getItem('vela.token')||''; })();
const api = (p, o) => { o=o||{}; o.headers=Object.assign({}, o.headers, {'X-Vela-Profile':velaProfile}, velaToken?{'X-Vela-Token':velaToken}:{}); return fetch(p, o).then(r => { if (r.status===401) { showLogin(); throw new Error('auth required'); } if (!r.ok) throw new Error(r.status); return r.json(); }); };
function showLogin(){ $('#login').classList.add('open'); setTimeout(()=>$('#loginPw').focus(),40); }
async function doLogin(){ const pw=$('#loginPw').value, code=$('#loginCode').value; const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,code})}); if(r.ok){ location.reload(); } else { $('#loginErr').textContent='Wrong password or code'; } }

function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k; }
function applyI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  renderNav(); renderStats(); renderChips();
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
function fmtDur(ms){ if(!ms) return ''; const s=Math.round(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }
function fmtSize(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB']; let i=0,n=b; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(n<10?1:0)+u[i]; }

let lastStats = {files:0,bytes:0,tags:0};
function renderStats(){
  const s = lastStats;
  $('#stats').textContent = `${s.files} ${t('files')} · ${fmtSize(s.bytes)} · ${s.tags} ${t('tagsLabel')}` + (state.tag?` · ${state.tag}`:'');
}
function navLabel(item){ return t(item.id) !== item.id ? t(item.id) : item.label; }

async function loadLayout(){
  state.layout = await api('/api/layout');
  const sb=state.layout.sidebar||[];
  if(!sb.some(i=>i.id==='favorites')) sb.push({id:'favorites',label:'Favourites',order:25});
  state.layout.sidebar=sb;
  applyTheme(); renderNav(); renderLayoutRows();
}
function navAction(item){
  if(item.type==='link'){ window.open(item.url,'_blank','noopener'); return; }
  if(item.id==='home'){ state.tag=''; state.q=''; $('#q').value=''; loadHome(); }
  else if(item.id==='tags'){ $('#chips').scrollIntoView({behavior:'smooth'}); }
  else if(item.id==='favorites'){ loadFavorites(); }
  else load();
}
function renderNav(){
  const nav=$('#nav'); if(!nav) return; nav.innerHTML='';
  (state.layout?.sidebar||[]).filter(i=>!i.hidden).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(item=>{
    const b=document.createElement('button'); b.textContent=navLabel(item);
    b.onclick=()=>navAction(item);
    if(item.id==='home') b.classList.add('on');
    nav.appendChild(b);
  });
  renderMobileNav();
}
function renderMobileNav(){
  const box=$('#mobileNav'); if(!box) return; box.innerHTML='';
  const items=(state.layout?.sidebar||[]).filter(i=>!i.hidden && i.type!=='link').slice(0,4);
  items.forEach(item=>{ const b=document.createElement('button'); b.textContent=navLabel(item); b.onclick=()=>navAction(item); box.appendChild(b); });
  const more=document.createElement('button'); more.textContent='⋯'; more.setAttribute('aria-label','More'); more.onclick=()=>$('#settingsBtn').click(); box.appendChild(more);
}
function renderLayoutRows(){
  const box=$('#layoutRows'); if(!box) return; box.innerHTML='';
  (state.layout?.sidebar||[]).forEach((item,i,arr)=>{
    const row=document.createElement('div'); row.className='row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!item.hidden;
    cb.onchange=()=>{ item.hidden=!cb.checked; renderNav(); };
    const n=document.createElement('div'); n.className='name'; n.textContent=navLabel(item);
    const up=document.createElement('button'); up.className='iconbtn'; up.textContent='↑'; up.disabled=i===0;
    up.onclick=()=>{ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; renderLayoutRows(); renderNav(); };
    const dn=document.createElement('button'); dn.className='iconbtn'; dn.textContent='↓'; dn.disabled=i===arr.length-1;
    dn.onclick=()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; renderLayoutRows(); renderNav(); };
    row.append(cb,n,up,dn); box.appendChild(row);
  });
}
function renderChips(){
  const chips=$('#chips'); if(!chips) return; chips.innerHTML='';
  const all=document.createElement('button'); all.className='chip'+(state.tag?'':' on'); all.textContent=t('all'); all.onclick=()=>{state.tag='';load();}; chips.appendChild(all);
  (state.tags||[]).forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(state.tag===x.name?' on':''); b.textContent=`${x.name} ${x.count}`; b.onclick=()=>{state.tag=x.name;load();}; chips.appendChild(b); });
}

function applyTheme(){
  const t=state.layout?.theme||{};
  document.documentElement.style.setProperty('--accent', t.accent||'#e0a458');
  document.documentElement.style.setProperty('--radius', (t.radius??12)+'px');
  document.body.dataset.density = t.density||'comfortable';
  document.body.classList.toggle('tv', !!t.tv);
  if($('#tvToggle')) $('#tvToggle').checked = !!t.tv;
  ['cast','haptics','markers'].forEach(k=>{
    const el=document.getElementById('show'+k[0].toUpperCase()+k.slice(1));
    if(el) el.checked = t[k] !== false;
    const btn=document.getElementById(k==='cast'?'castBtn':k==='haptics'?'hapticBtn':'markBtn');
    if(btn) btn.style.display = t[k]===false?'none':'';
  });
  if($('#accentInput')) $('#accentInput').value = t.accent||'#e0a458';
  if($('#densitySel')) $('#densitySel').value = t.density||'comfortable';
  if($('#radiusInput')) $('#radiusInput').value = t.radius??12;
}
async function loadProfiles(){
  const d=await api('/api/profiles'); const sel=$('#profileSel'); sel.innerHTML='';
  (d.profiles||[]).forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o); });
  sel.value=velaProfile;
  sel.onchange=()=>{ localStorage.setItem('vela.profile', sel.value); location.reload(); };
}
async function loadPlaylists(){ const d=await api('/api/playlists'); state.playlists=d.playlists||[]; renderPlaylists(); }
function renderPlaylists(){
  const box=$('#playlistRows'); if(!box) return; box.innerHTML='';
  if(!state.playlists.length){ const p=document.createElement('div'); p.className='small'; p.textContent='—'; box.appendChild(p); return; }
  state.playlists.forEach(p=>{
    const row=document.createElement('div'); row.className='row';
    const n=document.createElement('div'); n.className='name'; n.textContent=`${p.name} (${p.count})`;
    const open=document.createElement('button'); open.className='iconbtn'; open.textContent='▶';
    open.onclick=async()=>{ const d=await api('/api/playlists/'+p.id); state.view='playlist'; state.playlistId=p.id; state.items=d.items||[];
      $('#home').hidden=true; $('#chips').hidden=true; $('#grid').hidden=false;
      const g=$('#grid'); g.innerHTML=''; (d.items||[]).forEach(m=>g.appendChild(cardEl(m)));
      $('#playlistsPanel').classList.remove('open'); };
    const del=document.createElement('button'); del.className='iconbtn'; del.textContent='×';
    del.onclick=async()=>{ await api('/api/playlists/'+p.id,{method:'DELETE'}); loadPlaylists(); };
    row.append(n,open,del); box.appendChild(row);
  });
}
async function addToPlaylist(ids){
  if(!state.playlists.length){ const name=prompt(t('newPlaylist')); if(!name) return; const p=await api('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); state.playlists.push(p); }
  const names=state.playlists.map(p=>p.name).join(', ');
  const name=prompt(t('playlists')+': '+names, state.playlists[0].name); if(!name) return;
  const p=state.playlists.find(x=>x.name===name) || state.playlists[0];
  await api('/api/playlists/'+p.id+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  toast(t('addedToPlaylist')); loadPlaylists();
}
async function loadCollections(){ const d=await api('/api/collections'); state.collections=d.collections||[]; renderCollections(); }
function renderCollections(){
  const box=$('#collectionRows'); if(!box) return; box.innerHTML='';
  if(!state.collections.length){ const p=document.createElement('div'); p.className='small'; p.textContent='—'; box.appendChild(p); return; }
  state.collections.forEach(c=>{
    const row=document.createElement('div'); row.className='row';
    const n=document.createElement('div'); n.className='name'; n.textContent=c.name;
    const ap=document.createElement('button'); ap.className='iconbtn'; ap.textContent=t('apply');
    ap.onclick=async()=>{ let f={}; try{ f=JSON.parse(c.query); }catch(e){} state.q=f.q||''; state.tag=f.tag||''; $('#q').value=state.q; $('#collectionsPanel').classList.remove('open'); await load(); };
    const del=document.createElement('button'); del.className='iconbtn'; del.textContent='×';
    del.onclick=async()=>{ await api('/api/collections/'+c.id,{method:'DELETE'}); loadCollections(); };
    row.append(n,ap,del); box.appendChild(row);
  });
}
function updateBulk(){
  const bar=$('#bulkbar'); if(!bar) return;
  const n=state.selected.size;
  bar.hidden = n===0;
  $('#bulkCount').textContent = n+' '+t('selected');
}
async function bulk(action,value){
  const ids=[...state.selected]; if(!ids.length) return;
  const r=await api('/api/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,action,value})});
  state.selected.clear(); updateBulk(); toast(r.done+'/'+ids.length); await load();
}

function cardEl(m){
  const c=document.createElement('div'); c.className='card'; c.tabIndex=0;
  const pick=document.createElement('input'); pick.type='checkbox'; pick.className='pick'; pick.checked=state.selected.has(m.id);
  pick.onclick=e=>e.stopPropagation();
  pick.onchange=()=>{ if(pick.checked) state.selected.add(m.id); else state.selected.delete(m.id); updateBulk(); };
  c.appendChild(pick);
  const art=document.createElement('div'); art.className='art';
  art.style.backgroundImage=`url(/api/media/${m.id}/cover)`;
  if(m.duration_ms){ const dd=document.createElement('div'); dd.className='dur'; dd.textContent=fmtDur(m.duration_ms); art.appendChild(dd); }
  if(m.width){ const r=document.createElement('div'); r.className='res'; r.textContent=m.height?`${m.height}p`:''; art.appendChild(r); }
  const meta=document.createElement('div'); meta.className='meta';
  const tt=document.createElement('div'); tt.className='title'; tt.textContent=m.title;
  const tg=document.createElement('div'); tg.className='tags';
  (m.tags||[]).slice(0,3).forEach(x=>{ const sp=document.createElement('span'); sp.className='tag'; sp.textContent=x; tg.appendChild(sp); });
  meta.append(tt,tg); c.append(art,meta);
  if(state.view==='playlist' && state.playlistId){
    c.draggable=true;
    c.ondragstart=()=>{ state.dragId=m.id; };
    c.ondragover=e=>e.preventDefault();
    c.ondrop=async e=>{
      e.preventDefault();
      const from=state.items.findIndex(x=>x.id===state.dragId), to=state.items.findIndex(x=>x.id===m.id);
      if(from<0||to<0||from===to) return;
      const [it]=state.items.splice(from,1); state.items.splice(to,0,it);
      const g=$('#grid'); g.innerHTML=''; state.items.forEach(x=>g.appendChild(cardEl(x)));
      await api('/api/playlists/'+state.playlistId+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:state.items.map(x=>x.id)})});
      toast(t('layoutSaved'));
    };

let paletteSel=0, paletteItems=[];
function renderPalette(q){
  const box=$('#paletteList'); box.innerHTML=''; paletteItems=[];
  const cmds=paletteCommands.filter(c=>c.label.toLowerCase().includes(q.toLowerCase()));
  cmds.forEach(c=>paletteItems.push(c));
  if(q.length>=2){
    api('/api/media?q='+encodeURIComponent(q)+'&limit=8').then(d=>{
      (d.items||[]).forEach(m=>paletteItems.push({label:m.title,kind:'media',run:()=>openPlayer(m.id)}));
      paintPalette();
    }).catch(()=>{});
  }
  paintPalette();
}
function paintPalette(){
  const box=$('#paletteList'); box.innerHTML='';
  paletteItems.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='item'+(i===paletteSel?' sel':'');
    const l=document.createElement('span'); l.textContent=it.label;
    const k=document.createElement('span'); k.className='kind'; k.textContent=it.kind;
    row.append(l,k); row.onclick=()=>{ closePalette(); it.run(); };
    box.appendChild(row);
  });
  if(!paletteItems.length){ const row=document.createElement('div'); row.className='item'; row.textContent='—'; box.appendChild(row); }
}
function openPalette(){ $('#palette').classList.add('open'); $('#paletteInput').value=''; paletteSel=0; renderPalette(''); setTimeout(()=>$('#paletteInput').focus(),30); }
function closePalette(){ $('#palette').classList.remove('open'); }

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#palette').classList.contains('open')?closePalette():openPalette(); return; }
  if(!$('#palette').classList.contains('open')) return;
  if(e.key==='Escape'){ closePalette(); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); paletteSel=Math.min(paletteSel+1,paletteItems.length-1); paintPalette(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); paletteSel=Math.max(0,paletteSel-1); paintPalette(); }
  else if(e.key==='Enter'){ const it=paletteItems[paletteSel]; if(it){ closePalette(); it.run(); } }
});

const haptic={ws:null,ctx:null,an:null,src:null,timer:null,on:false};
async function toggleHaptics(){
  const v=$('#video');
  if(haptic.on){ stopHaptics(); return; }
  try{
    haptic.ws=new WebSocket('ws://127.0.0.1:8771');
    await new Promise((res,rej)=>{ haptic.ws.onopen=res; haptic.ws.onerror=rej; setTimeout(rej,1500); });
    haptic.ws.send(JSON.stringify({op:'hello'}));
    if(!haptic.ctx){ haptic.ctx=new AudioContext(); haptic.src=haptic.ctx.createMediaElementSource(v); haptic.an=haptic.ctx.createAnalyser(); haptic.an.fftSize=1024; haptic.src.connect(haptic.an); haptic.an.connect(haptic.ctx.destination); }
    haptic.on=true; $('#hapticBtn').textContent='◉';
    haptic.timer=setInterval(()=>{
      if(v.paused){ return; }
      const d=new Uint8Array(haptic.an.frequencyBinCount); haptic.an.getByteFrequencyData(d);
      const ny=haptic.ctx.sampleRate/2, n=d.length; let lo=0,lc=0,hi=0,hc=0;
      for(let i=1;i<n;i++){ const f=i*ny/n; if(f<120){ lo+=d[i]; lc++; } else if(f>2000&&f<8000){ hi+=d[i]; hc++; } }
      const low=lc?lo/lc/255:0, high=hc?hi/hc/255:0;
      haptic.ws.send(JSON.stringify({op:'tick',low,high,intensity:Number($('#hapticInt').value)/100}));
    },60);
    toast('feedback on');
  }catch(e){ toast('hapticsd offline'); try{haptic.ws.close()}catch(_){} haptic.ws=null; }
}
function stopHaptics(){
  if(haptic.timer) clearInterval(haptic.timer); haptic.timer=null;
  if(haptic.ws){ try{ haptic.ws.send(JSON.stringify({op:'stop'})); haptic.ws.close(); }catch(e){} haptic.ws=null; }
  haptic.on=false; $('#hapticBtn').textContent='◎';
}

function tvMove(dir){
  const cards=[...document.querySelectorAll('#grid .card, #home .card')];
  if(!cards.length) return;
  const cur=document.activeElement && document.activeElement.classList.contains('card')?document.activeElement:null;
  if(!cur){ cards[0].focus(); return; }
  const r=cur.getBoundingClientRect();
  let best=null, bestScore=1e9;
  cards.forEach(c=>{
    if(c===cur) return;
    const b=c.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(r.left+r.width/2), dy=(b.top+b.height/2)-(r.top+r.height/2);
    const ok = dir==='left'?dx<-8:dir==='right'?dx>8:dir==='up'?dy<-8:dy>8;
    if(!ok) return;
    const score=(dir==='left'||dir==='right')?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*3;
    if(score<bestScore){ bestScore=score; best=c; }
  });
  if(best) best.focus();
}
let padPrev={};
setInterval(()=>{
  if(!document.body.classList.contains('tv')) return;
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){ if(!p) continue;
    const ax=p.axes[0]||0, ay=p.axes[1]||0;
    const dir = ax<-0.5?'left':ax>0.5?'right':ay<-0.5?'up':ay>0.5?'down':'';
    if(dir && padPrev[p.index]!==dir){ tvMove(dir); padPrev[p.index]=dir; }
    if(!dir) padPrev[p.index]='';
    if(p.buttons[0] && p.buttons[0].pressed && document.activeElement.classList.contains('card')){ document.activeElement.click(); }
  }
},200);
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('tv') && !state.current && !document.querySelector('#palette.open')){
    if(e.key==='ArrowLeft'){ e.preventDefault(); tvMove('left'); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); tvMove('right'); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); tvMove('up'); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); tvMove('down'); return; }
    if(e.key==='Enter' && document.activeElement.classList.contains('card')){ e.preventDefault(); document.activeElement.click(); return; }
  }
  if(!state.current || document.activeElement.tagName==='INPUT') return;
  const v=$('#video');
  if(e.key==='ArrowRight'){ v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
  else if(e.key==='ArrowLeft'){ v.currentTime=Math.max(0,v.currentTime-5); }
  else if(e.key===' '){ e.preventDefault(); v.paused?v.play():v.pause(); }
  else if(e.key==='f'){ document.fullscreenElement?document.exitFullscreen():v.requestFullscreen().catch(()=>{}); }
  else if(e.key==='n'){ $('#nextBtn').click(); }
});
async function refreshHealth(){
  try{ const h=await api('/api/health'); const el=$('#healthPill'); if(el){ el.textContent=h.scanning?'● scanning':'● online'; el.style.color=h.scanning?'var(--accent)':'#6fbf73'; } }
  catch(e){ const el=$('#healthPill'); if(el){ el.textContent='● offline'; el.style.color='#d06b6b'; } }
}
setInterval(refreshHealth,15000); refreshHealth();

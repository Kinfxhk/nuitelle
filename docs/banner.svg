<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1440" height="600" fill="url(#bg)"/>
  <circle cx="1180" cy="120" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <g stroke="#242c3a" stroke-width="1" opacity="0.5">
    <path d="M0 520 H1440"/>
    <path d="M0 80 H1440"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="196" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="112" font-weight="700" fill="#e8ecf3" letter-spacing="-2">nuitelle<tspan fill="#e0a458">.</tspan></text>
  <text x="76" y="268" font-family="'Noto Sans TC', 'PingFang TC', system-ui, sans-serif" font-size="30" fill="#e8ecf3">自己的影片，自己管理。</text>
  <text x="76" y="312" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#8b96a8">Your videos, your library. Local-first, one binary, no cloud.</text>

  <!-- chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="17" fill="#c8d1e0">
    <g transform="translate(76,376)">
      <rect width="172" height="42" rx="21" fill="#151922" stroke="#242c3a"/>
      <text x="24" y="27">Local-first</text>
    </g>
    <g transform="translate(262,376)">
      <rect width="196" height="42" rx="21" fill="#151922" stroke="#242c3a"/>
      <text x="24" y="27">5 languages</text>
    </g>
    <g transform="translate(472,376)">
      <rect width="236" height="42" rx="21" fill="#151922" stroke="#242c3a"/>
      <text x="24" y="27">Whisper subtitles</text>
    </g>
    <g transform="translate(76,430)">
      <rect width="196" height="42" rx="21" fill="#151922" stroke="#242c3a"/>
      <text x="24" y="27">Layout as JSON</text>
    </g>
    <g transform="translate(286,430)">
      <rect width="222" height="42" rx="21" fill="#151922" stroke="#242c3a"/>
      <text x="24" y="27">Range streaming</text>
    </g>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8b96a8">
    <text x="76" y="524">macOS  ·  Linux  ·  Docker  ·  AGPL-3.0</text>
    <text x="76" y="558">github.com/Kinfxhk/nuitelle</text>
  </g>

  <!-- abstract app window -->
  <g transform="translate(860,150)">
    <rect width="500" height="330" rx="16" fill="#151922" stroke="#2a3344"/>
    <rect width="500" height="44" rx="16" fill="#1b2130"/>
    <rect y="30" width="500" height="14" fill="#1b2130"/>
    <circle cx="24" cy="22" r="5" fill="#3a465c"/>
    <circle cx="42" cy="22" r="5" fill="#3a465c"/>
    <circle cx="60" cy="22" r="5" fill="#3a465c"/>
    <rect x="0" y="44" width="120" height="286" fill="#121722"/>
    <g fill="#2b3446">
      <rect x="16" y="70" width="88" height="10" rx="5"/>
      <rect x="16" y="98" width="72" height="10" rx="5" fill="#e0a458"/>
      <rect x="16" y="126" width="80" height="10" rx="5"/>
      <rect x="16" y="154" width="64" height="10" rx="5"/>
    </g>
    <g>
      <rect x="140" y="70" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
      <rect x="256" y="70" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
      <rect x="372" y="70" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
      <rect x="140" y="146" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
      <rect x="256" y="146" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
      <rect x="372" y="146" width="104" height="64" rx="8" fill="#1b2130" stroke="#2a3344"/>
    </g>
    <g fill="#2b3446">
      <rect x="140" y="230" width="150" height="9" rx="4"/>
      <rect x="140" y="248" width="96" height="9" rx="4"/>
    </g>
    <rect x="140" y="284" width="336" height="6" rx="3" fill="#242c3a"/>
    <rect x="140" y="284" width="120" height="6" rx="3" fill="#e0a458"/>
  </g>
</svg>
